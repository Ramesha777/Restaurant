<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - WHITMORE REANS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="employee.css">
    <link rel="stylesheet" href="customer/customer.css">
    <style>
        /* Custom overrides for 5-column layout and smaller cards */
        @media (min-width: 1200px) {
            .menu-grid {
                grid-template-columns: repeat(5, 1fr) !important;
            }
        }
        
        .menu-item-image {
            height: 120px !important; /* Decrease image size */
        }

        .menu-item-content {
            padding: 0.8rem !important; /* Compact padding */
        }

        .menu-item h3 {
            font-size: 1rem !important; /* Smaller title */
        }

        /* Spicy Level Hover Effects */
        .spicy-btn {
            transition: all 0.2s ease-in-out;
        }
        .spicy-btn-normal:hover {
            background-color: purple !important;
            color: white !important;
        }
        
        .spicy-btn-medium:hover {
            background-color: orange !important; 
            color: white !important;
        }
        
        .spicy-btn-extra:hover {
            background-color: red !important;
            color: white !important;
        }
        
        .spicy-btn-none:hover {
            background-color: green !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Employee Dashboard</h1>
                    <p id="employeeName" style="opacity: 0.9; margin-top: 0.5rem;">Welcome back!</p>
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="toggleEmployeeView()" id="toggleViewBtn" style="margin-right: 1rem;">🛒 Customer Order</button>
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="filters" id="orderFilters" style="display: none;">
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; width: 100%;">
                <div style="flex: 1; min-width: 200px;">
                    <input type="text" id="orderSearchInput" placeholder="Search by Order Number (e.g., 1234)" 
                    <input type="text" id="orderSearchInput" placeholder="Search by Order # or Customer Name" 
                           style="width: 100%; padding: 0.75rem; border: 2px solid black; border-radius: 8px; font-size: 1rem;"
                           onkeyup="handleOrderSearch(event)">
                    <button class="btn btn-secondary" onclick="searchOrder()" style="margin-top: 0.5rem; width: 50%; background:orangered">Search Order</button>
                </div>
                        </div>
        </div>

        <!-- Orders View -->
        <div id="ordersView">
            <!-- Order Search Results -->
            <div id="orderSearchResults" style="display: none; margin-bottom: 2rem;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2>Order Details</h2>
                        <button class="btn btn-secondary" onclick="clearOrderSearch()" style="color:#c00; background:whitesmoke">Close</button>            
                    </div>
                    <div id="orderDetailsContent"></div>
                </div>
            </div> 
            
            <div class="orders-container" id="ordersContainer">
                <p style="text-align: center; color: #666;">Loading orders...</p>
            </div>
        </div>

        <!-- Customer Order View -->
        <div id="customerOrderView" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Customer Order</h1>
                <div>
                    <button class="btn btn-secondary" onclick="showEmployeeCart()" style="margin-right: 1rem; color: #ffffff; background: #ff6f00;">
                        🛒 Cart (<span id="employeeCartCount">0</span>)
                    </button>
                    <button class="btn btn-secondary" onclick="showEmployeeOrders()" style="color: #ffffff; background: #ff6f00;">View Orders</button> 
                </div>
            </div>



            <!-- Menu View -->
            <div id="employeeMenuView">
                <div style="margin-bottom: 1rem;">
                    <input type="text" id="employeeMenuSearchInput" placeholder="Search food items..." 
                           style="width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;"
                           onkeyup="searchEmployeeMenuByName()">
                </div>
                <div id="employeeCategoryFilters" class="order-filters" style="margin-bottom: 2rem;">
                </div>
                <div class="menu-grid" id="employeeMenuGrid">
                    <p style="text-align: center; color: #666;">Loading menu...</p>
                </div>
            </div>

            <!-- Cart View -->
            <div id="employeeCartView" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>Order Cart</h2>
                    <button class="btn btn-secondary" onclick="showEmployeeMenu()">← Back to Menu</button>
                </div>
                <div class="card">
                    <div id="employeeCartContainer">
                        <p style="text-align: center; color: #666;">Your cart is empty</p>
                    </div>
                    <div id="employeeCartSummary" style="display: none; margin-top: 2rem;">
                        <div class="form-group">
                            <label for="employeeTableNumber">Table Number *</label>
                            <input type="number" id="employeeTableNumber" min="1" placeholder="Enter table number" required>
                        </div>
                        <div class="form-group">
                            <label for="employeeOrderNotes">Special Instructions</label>
                            <textarea id="employeeOrderNotes" rows="3" placeholder="E.g., Spicy level, food allergies, etc."></textarea>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 1rem 0; border-top: 2px solid #e0e0e0; margin-top: 1rem;">
                            <span><strong>Subtotal:</strong></span>
                            <span id="employeeSubtotal">£0.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 0.5rem 0;">
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 1rem 0; border-top: 2px solid #e0e0e0; font-size: 1.25rem; font-weight: 600; color: #ff6f00;">
                            <span><strong>Total:</strong></span>
                            <span id="employeeTotal">£0.00</span>
                        </div>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" onclick="employeeCheckout()">
                            Place Order (Auto-Confirmed)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spicy Level Modal for Employee Customer Order -->
    <div class="modal" id="employeeSpicyLevelModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>🌶️ Select Spicy Level</h3>
                <button class="close-btn" onclick="closeEmployeeSpicyLevelModal()">&times;</button>
            </div>
            <div style="padding: 1.5rem;">
                <p style="margin-bottom: 1rem; color: #666;">How spicy would you like your <strong id="employeeSpicyItemName"></strong>?</p>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <button class="btn btn-secondary" onclick="selectEmployeeSpicyLevel('normal')" style="text-align: left; padding: 1rem; color: purple; border: 2px solid purple;">
                        🌶️ Normal - Mild heat
                    </button>
                    <button class="btn btn-secondary" onclick="selectEmployeeSpicyLevel('medium')" style="text-align: left; padding: 1rem; color : orange; border: 2px solid orange;">
                        🌶️🌶️ Medium - Moderate heat
                    </button>
                    <button class="btn btn-secondary" onclick="selectEmployeeSpicyLevel('extra')" style="text-align: left; padding: 1rem; color: red; border: 2px solid red;">
                        🌶️🌶️🌶️ Extra Spicy - Very hot
                    </button>
                    <button class="btn btn-secondary" onclick="selectEmployeeSpicyLevel('no spicy')" style="text-align: left; padding: 1rem; color: green; border: 2px solid green;">
                        No Spicy - No spice
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Order Modal for Employee -->
    <div class="modal" id="employeeEditOrderModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Edit Order Details</h3>
                <button class="close-btn" onclick="closeEmployeeEditOrderModal()">&times;</button>
            </div>
            <form id="employeeEditOrderForm">
                <input type="hidden" id="employeeEditOrderId">
                <div class="form-group">
                    <label for="employeeEditTableNumber">Table Number</label>
                    <input type="number" id="employeeEditTableNumber" min="1" placeholder="Enter table number">
                </div>
                <div class="form-group">
                    <label for="employeeEditOrderNotes">Special Instructions</label>
                    <textarea id="employeeEditOrderNotes" rows="3" placeholder="E.g., Spicy level, food allergies, etc."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update Order</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Firebase Configuration from Backend/firebase.js -->
    <script src="../Backend/firebase.js"></script>
    <script src="script.js"></script>
    <script src="employee.js"></script>
</body>
</html>
